version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: qlbm_db
    environment:
      POSTGRES_DB: qlbm_db
      POSTGRES_USER: qlbm_user
      POSTGRES_PASSWORD: qlbm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qlbm_backend
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DATABASE_URL=postgres://qlbm_user:qlbm_password@db:5432/qlbm_db
      - DEBUG=False
      - SECRET_KEY=django-insecure-qlbm-secret-key-for-local-development-prod-123
    depends_on:
      - db
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qlbm_frontend
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
